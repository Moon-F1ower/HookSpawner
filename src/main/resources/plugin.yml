name: HookSpawner
version: 1.2.0
main: com.moonflower.hookspawner.HookSpawner
api-version: '1.21'
description: Bridge plugin for RoseLoot to spawn mobs at the fishing hook.
author: Moon Flower
website: https://github.com/Moon-F1ower/HookSpawner

commands:
  hookspawner:
    description: Main command for HookSpawner
    usage: /<command> [reload|list|test]
    aliases: [hs]
    permission: hookspawner.admin

permissions:
  hookspawner.admin:
    description: Allows use of HookSpawner commands
    default: op
